# Builds and verifies Letterblade on every push to main and on every pull request.
# This is the gate that catches breakage (e.g. Renovate dependency bumps) before it
# lands on main; maven-github-publish.yml publishes the jar on release.
#
# JDK 27 with JavaFX bundled (Azul Zulu 'jdk+fx'): Letterblade resolves the javafx.*
# modules from the JDK and has no org.openjfx dependencies, mirroring the local build.
# Java 27 (STS) since 2026-10-13, with the kit: AtlantaFX 3 needs JavaFX 27.
#
# druvu-lib-fx is a release, checked out at the tag that pom.xml's druvu-lib-fx.version
# names and installed from source: GITHUB_TOKEN cannot read another repository's packages,
# and the kit is not on Maven Central.
#
# The headless JavaFX UI tests start the real toolkit (Platform.startup), so the verify
# step runs under xvfb to give it a virtual display (no windows are ever shown). xvfb is
# preinstalled on GitHub's ubuntu-latest image.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out letterblade
        uses: actions/checkout@v7

      - name: Read the druvu-lib-fx version from the pom
        id: kit
        run: echo "tag=v$(sed -n 's:.*<druvu-lib-fx.version>\(.*\)</druvu-lib-fx.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Check out druvu-lib-fx at that release tag
        uses: actions/checkout@v7
        with:
          repository: DenissLarka/druvu-lib-fx
          ref: ${{ steps.kit.outputs.tag }}
          path: druvu-lib-fx

      - name: Set up JDK 27 (Zulu, JavaFX bundled)
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Install druvu-lib-fx to the local repository
        run: mvn -B -f druvu-lib-fx/pom.xml install -DskipTests

      - name: Build and verify
        run: xvfb-run -a mvn -B verify
