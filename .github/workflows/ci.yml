# Builds and verifies Letterblade on every push to main and on every pull request.
# This is the gate that catches breakage (e.g. Renovate dependency bumps) before it
# lands on main; maven-github-publish.yml publishes the jar on release.
#
# JDK 27 with JavaFX bundled (Azul Zulu 'jdk+fx'): Letterblade resolves the javafx.*
# modules from the JDK and has no org.openjfx dependencies, mirroring the local build.
# Java 27 (STS) since 2026-10-13, with the kit: AtlantaFX 3 needs JavaFX 27.
#
# druvu-lib-fx is consumed as the SNAPSHOT of its main (see druvu-lib-fx.version in
# pom.xml). SNAPSHOTs have no remote, so this workflow checks out the kit's main and
# installs it from source. That couples the two repos: the pom property must say what
# the kit's main pom says, or resolution fails (main-branch tracking went red exactly
# that way from 2026-07-19 to 2026-08-02). At the next kit release the pom is pinned to
# the release and the ref below goes back to its tag - GitHub Packages holds releases
# only and needs auth this workflow does not carry. Maven Central is deliberately not an
# option: it was ruled out for druvu-lib-fx.
#
# The headless JavaFX UI tests start the real toolkit (Platform.startup), so the verify
# step runs under xvfb to give it a virtual display (no windows are ever shown). xvfb is
# preinstalled on GitHub's ubuntu-latest image.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out letterblade
        uses: actions/checkout@v7

      - name: Check out druvu-lib-fx main (the SNAPSHOT in pom's druvu-lib-fx.version; back to the tag at the next kit release)
        uses: actions/checkout@v7
        with:
          repository: DenissLarka/druvu-lib-fx
          ref: main
          path: druvu-lib-fx

      - name: Set up JDK 27 (Zulu, JavaFX bundled)
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Install druvu-lib-fx to the local repository
        run: mvn -B -f druvu-lib-fx/pom.xml install -DskipTests

      - name: Build and verify
        run: xvfb-run -a mvn -B verify
