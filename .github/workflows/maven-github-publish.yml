# Publishes the Letterblade artifact to GitHub Packages when a release is published.
#
# Why an app publishes a jar at all: letterblade-dist bundles this artifact into the
# macOS/Windows/Linux installer images. Without a published artifact each dist box
# rebuilds its own copy from the tag and nothing verifies the three agree — which is
# exactly what happened for v1.0.0 (published by hand from the tag on 2026-08-16).
# House rule since 2026-08-16: anything shipping inside an installer image is resolved
# from Packages, not from a local `mvn install`.
#
# Build setup mirrors ci.yml — see its header for the reasoning:
#   - Zulu 'jdk+fx' because Letterblade resolves javafx.* from the JDK, no org.openjfx deps;
#   - druvu-lib-fx checked out at the release tag that pom.xml's druvu-lib-fx.version names
#     and installed from source, because GITHUB_TOKEN grants no read access to another
#     repository's packages;
#   - xvfb, because the headless UI tests start the real JavaFX toolkit.
name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out letterblade
        uses: actions/checkout@v7

      - name: Read the druvu-lib-fx version from the pom
        id: kit
        run: echo "tag=v$(sed -n 's:.*<druvu-lib-fx.version>\(.*\)</druvu-lib-fx.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Check out druvu-lib-fx at that release tag
        uses: actions/checkout@v7
        with:
          repository: DenissLarka/druvu-lib-fx
          ref: ${{ steps.kit.outputs.tag }}
          path: druvu-lib-fx

      - name: Set up JDK 27 (Zulu, JavaFX bundled)
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'maven'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Install druvu-lib-fx to the local repository
        run: mvn -B -f druvu-lib-fx/pom.xml install -DskipTests

      - name: Publish to GitHub Packages
        run: xvfb-run -a mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
